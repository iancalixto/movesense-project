name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  version: "latest"

            - name: Set up Python
              run: uv python install 3.11

            - name: Install dependencies
              run: make install

            - name: Run test suite
              run: make test
